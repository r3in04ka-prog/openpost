[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openpost-mail"
version = "0.1.0"
description = "A small, local-first, open-source desktop IMAP/SMTP email client"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.gui-scripts]
openpost = "openpost.app:main"

[tool.setuptools.packages.find]
include = ["openpost*"]
