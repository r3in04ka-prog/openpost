[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openpost-mail"
version = "0.2.0"
description = "A small, local-first, open-source desktop IMAP/SMTP email client"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
dependencies = ["customtkinter==5.2.2", "Pillow==11.3.0"]

[project.gui-scripts]
openpost = "openpost.shell:main"

[tool.setuptools.packages.find]
include = ["openpost*"]

[tool.setuptools.package-data]
openpost = ["assets/*.png"]
