name: App screenshot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pillow==11.3.0
      - run: python -m tests.capture_preview
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.2.1 openpost-preview.png --clobber
